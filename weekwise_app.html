 if(!isFixed){const meta=card.querySelector('.meta');meta.innerHTML=`<button type="button" aria-label="Edit this block hours">${b.h}h</button>`;meta.querySelector('button').onclick=()=>{meta.innerHTML=`<div class="hours-edit"><input aria-label="Block hours" type="number" min="0.01" step="any" value="${b.h}" required><button type="button" aria-label="Save block hours">✓</button><button type="button" aria-label="Cancel block hours">×</button></div>`;const input=meta.querySelector('input'),buttons=meta.querySelectorAll('button');const save=()=>{if(!input.reportValidity())return;b.h=Number(input.value);renderAll()};buttons[0].onclick=save;buttons[1].onclick=()=>renderAll();input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();save()}if(e.key==='Escape')renderAll()};input.focus();input.select?.()};if(canDrag(b)){const move=document.createElement('button');move.type='button';move.textContent='⋯';move.setAttribute('aria-label','Move work block');move.title='移动日期或调整顺序';move.onclick=()=>moveWorkBlockDialog(b);meta.append(move)}}
 });}

// One delegated handler survives Calendar / Today re-renders and cloned cards.
function applyCalendarAction(id,action){
 const b=blocks.find(x=>x.id===id);if(!b)return;
 if(action==='finished'){setTaskCompletion(b.p,b.t,!taskDone[keyFor(b.p,b.t)],b.w);renderAll();return}
 if(action==='worked'){
  if(taskDone[keyFor(b.p,b.t)])setTaskCompletion(b.p,b.t,false,b.w);
  delete b.completedAt;dailyResults.set(b.id,'worked');
  if(!b.carried){
   const date=weekDate(b.w,b.d+1).toISOString().slice(0,10),w=dateWeek(date),d=((timelineDay(date)-2)%7+7)%7;
   let next=blocks.find(x=>x!==b&&x.p===b.p&&x.t===b.t&&x.w===w&&x.d===d&&!x.carried);
   if(!next){next={id:uid(),p:b.p,t:b.t,w,d,h:b.h,carriedFrom:b.id};blocks.push(next)}
   b.carried=next.id;b.carriedAt=new Date().toISOString();
  }
  renderAll();return;
 }
 if(action==='remove'){protectWorkBlockRemoval(b);return}
}
document.addEventListener('click',event=>{
 const button=event.target.closest('[data-inline-action]');if(!button)return;
 event.preventDefault();event.stopPropagation();
 applyCalendarAction(button.dataset.inlineAction,button.dataset.action);
});
// V9 is authoritative after migration. Restore before first V9 write.
if(v9.workspace){const state=v9.workspace;for(const [target,source] of [[projects,state.projects],[blocks,state.blocks],[fixed,state.fixed],[weeklyExtra,state.weeklyExtra]])target.splice(0,target.length,...source);for(const [target,source] of [[capturedWeeks,state.capturedWeeks],[capturedEstimates,state.capturedEstimates],[completions,state.completions],[dailyResults,state.dailyResults]]){target.clear();for(const pair of source)target.set(...pair)}if(state.deadlines)deadlines.splice(0,deadlines.length,...state.deadlines);taskDone={};for(const key of completions.keys())taskDone[key]=true;}

// Restore independent manual entry points without changing Capture or inline editors.
const projectFilters={inactive:true,completed:true,...(v9.projectFilters||{})};
const revealedProjects=new Set(v9.revealedProjects||[]);
$('#hide').checked=projectFilters.inactive;$('#hide-completed').checked=projectFilters.completed;
const entrySnapshot=snapshotV9;
snapshotV9=()=>({...entrySnapshot(),projectFilters:{...projectFilters},revealedProjects:[...revealedProjects]});
const filteredProjects=visibleProjects;
visibleProjects=()=>{const visible=filteredProjects();return orderedProjects(projects.filter(p=>visible.includes(p)||revealedProjects.has(p.stableId)))};
for(const [selector,key] of [['#hide','inactive'],['#hide-completed','completed']])$(selector).onchange=()=>{projectFilters[key]=$(selector).checked;revealedProjects.clear();renderAll()};
function revealCreatedProject(p){revealedProjects.add(p.stableId);selected=p.id;showView('week');$('#left').classList.remove('off')}
function newProjectWizard(){
 const dialog=$('#project-editor');let step=1;const draft={name:'',hours:'',deadline:'',tasks:['']};
 const draw=()=>{dialog.innerHTML=`<form><strong>Step ${step} — ${step===1?'Project details':'Tasks'}</strong>${step===1?`<label>Name<input name="name" required value="${esc(draft.name)}"></label><label>Estimated hours (optional)<input name="hours" type="number" min="0.01" step="any" value="${esc(draft.hours)}"></label><label>DDL (optional)<input name="deadline" type="date" value="${esc(draft.deadline)}"></label>`:`<p>Add subtasks below. You can add more later and edit each task’s hours and timing.</p><div data-task-inputs>${draft.tasks.map((name,i)=>`<div class="project-task-input"><input data-task-name="${i}" aria-label="Task ${i+1}" value="${esc(name)}"><button type="button" data-delete-task="${i}" aria-label="Delete task ${i+1}">×</button></div>`).join('')}</div><button type="button" data-add-task>＋ Add task</button>`}<p role="status"></p><div><button type="button" data-cancel>Cancel</button>${step===2?'<button type="button" data-back>Back</button>':''}<button type="button" data-advance>${step===1?'Next → Subtasks':'Create Project'}</button></div></form>`;
 const form=dialog.querySelector('form'),field=n=>form.elements.namedItem(n),rememberTasks=()=>{draft.tasks=[...form.querySelectorAll('[data-task-name]')].map(x=>x.value)};
 form.querySelector('[data-cancel]').onclick=()=>dialog.close();
 if(step===2){form.querySelector('[data-back]').onclick=()=>{rememberTasks();step=1;draw()};form.querySelector('[data-add-task]').onclick=()=>{rememberTasks();draft.tasks.push('');draw()};form.querySelectorAll('[data-delete-task]').forEach(b=>b.onclick=()=>{rememberTasks();draft.tasks.splice(+b.dataset.deleteTask,1);draw()})}
 const advance=()=>{if(!form.reportValidity())return;if(step===1){if(!field('name').value.trim())return;Object.assign(draft,{name:field('name').value.trim(),hours:field('hours').value,deadline:field('deadline').value});step=2;draw();return}rememberTasks();if(localStorage.getItem(V9_KEY)!==diLastRaw){form.querySelector('[role=status]').textContent='Workspace changed in another tab. Reload before saving.';return}
 const hours=draft.hours===''?null:Number(draft.hours),p={id:Math.max(0,...projects.map(p=>p.id))+1,stableId:uid(),name:draft.name,color:'#789b77',tasks:draft.tasks.map(x=>x.trim()).filter(Boolean),weeks:[],estimatedHours:hours,hours:hours||0,effort:hours===null?'':hours+'h',ddl:draft.deadline?timelineDay(draft.deadline):null,markers:draft.deadline?[{type:'ddl',day:timelineDay(draft.deadline)}]:[]};projects.push(p);p.tasks.forEach((name,t)=>{v9.subtasks[keyFor(p.id,t)]={id:uid(),projectId:p.stableId,name,type:'flexible',estimatedHours:0,completedAt:null}});revealCreatedProject(p);renderAll();if(storageFailure){form.querySelector('[role=status]').textContent=storageFailure;return}dialog.close();};form.querySelector('[data-advance]').onclick=advance;form.onsubmit=e=>{e.preventDefault();advance()};
 };draw();dialog.showModal();dialog.querySelector('[name=name]').focus();
}
function manualEntry(project=null){
 if(!project)return newProjectWizard();
 const dialog=$('#project-editor'),adding=!!project;
 dialog.innerHTML=`<form><strong>${adding?'Add Task · '+esc(project.name):'New Project'}</strong><label>Name<input name="name" required></label><label>Estimated hours<input name="hours" type="number" min="0.01" step="any"></label>${adding?'<label>Type<select name="type"><option value="flexible">Flexible</option><option value="fixed">Fixed</option><option value="waiting">Waiting</option></select></label><div data-timing></div>':''}<label>DDL (optional)<input name="deadline" type="date"></label><p role="status"></p><div><button type="button" data-cancel>Cancel</button><button type="button" data-create>${adding?'Add Task':'Create Project'}</button></div></form>`;
 const form=dialog.querySelector('form'),field=n=>form.elements.namedItem(n);
 if(adding){const draw=()=>{form.querySelector('[data-timing]').innerHTML=field('type').value==='fixed'?'<label>Date<input name="date" type="date" required></label><label>Start time (optional)<input name="start" type="time"></label>':field('type').value==='flexible'?`<label>Week<select name="week"><option value="">No week</option>${weekOptions(openWeek)}</select></label>`:'<small>Waiting for a date</small>'};field('type').onchange=draw;draw()}
 form.querySelector('[data-cancel]').onclick=()=>dialog.close();
 const create=()=>{if(!form.reportValidity())return;const name=field('name').value.trim();if(!name){field('name').focus();return}
 const hours=field('hours').value?Number(field('hours').value):null,deadline=field('deadline').value||null;
 // Refuse stale-tab writes before touching any domain data.
 if(localStorage.getItem(V9_KEY)!==diLastRaw){form.querySelector('[role=status]').textContent='Workspace changed in another tab. Reload before saving.';return}
 let p=project;
 if(!adding){p={id:Math.max(0,...projects.map(p=>p.id))+1,stableId:uid(),name,color:'#789b77',tasks:[],weeks:[],effort:hours===null?'':hours+'h',hours:hours||0,ddl:deadline?timelineDay(deadline):null,markers:deadline?[{type:'ddl',day:timelineDay(deadline)}]:[]};projects.push(p)}
 else{const t=p.tasks.length,key=keyFor(p.id,t),type=field('type').value;p.tasks.push(name);v9.subtasks[key]={id:uid(),projectId:p.stableId,name,type,estimatedHours:hours||0,deadline,completedAt:null};if(hours)capturedEstimates.set(key,hours+'h');
 if(type==='fixed'){const date=field('date').value,off=timelineDay(date)-2;fixed.push({id:uid(),p:p.id,t,w:dateWeek(date),d:((off%7)+7)%7,name,durationHours:hours,startTime:field('start').value||null});p.markers.push({type:'fixed',task:t,day:timelineDay(date)})}
 if(type==='flexible'&&field('week').value){const w=Number(field('week').value);capturedWeeks.set(key,w);if(hours)weeklyExtra.push({p:p.id,t,w,h:hours})}}
 revealCreatedProject(p);renderAll();if(storageFailure){form.querySelector('[role=status]').textContent=storageFailure;return}dialog.close();document.querySelector(`[data-id="${p.id}"]`)?.scrollIntoView({block:'nearest'});
 };form.querySelector('[data-create]').onclick=create;form.onsubmit=e=>{e.preventDefault();create()};dialog.showModal();field('name').focus();
}
$('#new-project').onclick=()=>manualEntry();
const entryRenderCards=renderCards;
renderCards=()=>{entryRenderCards();document.querySelectorAll('[data-new-task]').forEach(b=>b.onclick=e=>{e.stopPropagation();manualEntry(getP(Number(b.dataset.newTask)))});document.querySelectorAll('#cards .project').forEach(card=>{if(revealedProjects.has(getP(Number(card.dataset.id)).stableId))card.classList.remove('dim')})};

diReady=true;openWeek=currentWeek();renderAll();
